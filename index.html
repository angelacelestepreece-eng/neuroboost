<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Neuroboost</title>
    <style>
      /* Wireframe fidelity: black and white only, one font, one size, one weight, generic boxes. */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font:
          16px/1.4 Arial,
          Helvetica,
          sans-serif;
        color: #000;
      }
      body {
        background: #fff;
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
      }
      .box {
        border: 2px solid #000;
        padding: 12px;
        margin-bottom: 12px;
      }
      .box p + p {
        margin-top: 8px;
      }
      .placeholder {
        border: 2px dashed #000;
        padding: 12px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 12px;
        margin-bottom: 12px;
      }
      button {
        background: #fff;
        border: 2px solid #000;
        padding: 10px 12px;
        cursor: pointer;
        text-align: left;
      }
      button:hover {
        background: #fff;
        outline: 2px solid #000;
        outline-offset: 2px;
      }
      button:focus-visible {
        outline: 3px solid #000;
        outline-offset: 2px;
      }
      button.on {
        background: #000;
        color: #fff;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        align-items: start;
      }
      .list {
        display: grid;
        gap: 8px;
      }
      button.full {
        width: 100%;
      }
      button:disabled {
        border-style: dashed;
        cursor: not-allowed;
      }
      input[type="text"] {
        border: 2px solid #000;
        background: #fff;
        padding: 10px 12px;
        width: 100%;
        max-width: 360px;
      }
      input[type="text"]:focus-visible {
        outline: 3px solid #000;
        outline-offset: 2px;
      }
      label {
        display: block;
        margin-bottom: 6px;
      }
      .scroll {
        overflow-x: auto;
        margin-bottom: 12px;
      }
      table.results {
        border-collapse: collapse;
        width: 100%;
      }
      table.results th,
      table.results td {
        border: 1px solid #000;
        padding: 4px 8px;
        text-align: left;
        vertical-align: top;
      }
      @media (max-width: 700px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

        const nums = (c.match(/\d+/g) || ["0"]).map(Number);
        const top = Math.max.apply(null, nums);
        return top <= 5

          : top <= 10

        });
        set.add(costBucket(cost));
        return { id, title, subject, cost, time, tags: set };

      const STORE_KEY = "neuroboostResults";
      const CSV_NAME = "Test Results.csv";
      // Paste your Google Apps Script web app URL between the quotes (see the setup steps).
      // While this is empty, results are only kept in the participant's own browser.
      const RESULTS_ENDPOINT =
        "https://script.google.com/macros/s/AKfycbzVe0KtqIxSaLeVCfLOGd_mSD2Enx7DPndkxUrrcmj_TKZC8zh74X2KGjXeiv-Uhx_oVg/exec";
      const COLS = [
        "participant_id",
        "session_id",
        "task_position",
        "task_number",
        "scenario",
        "started_at",
        "duration_sec",
        "click_count",

        "result",
        "view_at_endpoint",
        "path_at_endpoint",
        "click_sequence",
      ];
      let RESULTS = [];
      try {
        RESULTS = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      } catch (e) {
        RESULTS = [];
      }
      function saveAll() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(RESULTS));
        } catch (e) {}
      }

      // Send one task result to the Google Sheet. A row is marked sent only once the request goes through;
      // anything that fails stays unsent and is retried the next time the page loads or a task finishes.
      function sendRow(r) {
        if (!RESULTS_ENDPOINT || r.sent !== false) return;
        r.sending = true;
        fetch(RESULTS_ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(r),
        })
          .then(() => {
            r.sent = true;
          })
          .catch(() => {})
          .then(() => {
            delete r.sending;
            saveAll();
            if (state.phase === "review") render();
          });
      }
      function flushUnsent() {
        RESULTS.forEach((r) => {
          if (!r.sending) sendRow(r);
        });
      }

      function csvCell(v) {
        let s = String(v === undefined || v === null ? "" : v);
        if (/^[=+\-@]/.test(s)) s = "'" + s; // keep spreadsheet apps from treating text as a formula
        return '"' + s.replace(/"/g, '""') + '"';
      }
      function downloadCSV() {
        const lines = [COLS.map(csvCell).join(",")].concat(
          RESULTS.map((r) => COLS.map((c) => csvCell(r[c])).join(",")),
        );
        const blob = new Blob(["\ufeff" + lines.join("\r\n")], {
          type: "text/csv;charset=utf-8",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = CSV_NAME;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

        if (cls) e.className = cls;

        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;

      }

      /* ---------- SESSION FLOW ---------- */
      function beginSession(participant) {
        session = {
          id: Math.random().toString(36).slice(2, 8),
          participant: participant,
          order: shuffle(TASKS.slice()),
          idx: 0,
        };
        cur = null;
        state.phase = "brief";
        render();
      }
      function startTask() {
        state.view = "kind";
        state.filters = [];
        state.open = [];
        state.path = [];
        cur = {
          task: session.order[session.idx],
          startedAt: new Date().toISOString(),
          t0: performance.now(),
          clicks: [],
        };
        state.phase = "task";
        render();
      }
      // Clicking any lesson ends the task: record the endpoint, then move straight on.
      function openLesson(l) {
        log("endpoint", l.title);
        const dur = performance.now() - cur.t0;
        const ok = l.title === cur.task.answer;
        RESULTS.push({
          participant_id: session.participant,
          session_id: session.id,
          task_position: session.idx + 1,
          task_number: cur.task.id,
          scenario: cur.task.text,
          started_at: cur.startedAt,
          duration_sec: (dur / 1000).toFixed(1),
          click_count: cur.clicks.length,
          endpoint: l.title,
          correct_answer: cur.task.answer,
          result: ok ? "Correct" : "Incorrect",
          view_at_endpoint: VIEWS[state.view],
          path_at_endpoint: pathText(),
          click_sequence: cur.clicks
            .map(
              (c) =>
                c.type +
                ": " +
                c.label +
                " (" +
                (c.ms / 1000).toFixed(1) +
                "s)",
            )
            .join(" | "),
          sent: false,
        });
        saveAll();
        flushUnsent();
        cur = null;
        session.idx++;
        if (session.idx >= session.order.length) {
          state.phase = "done";
        } else {
          state.phase = "brief";
        }
        window.scrollTo(0, 0);
        render();
      }

      /* ---------- SCREENS: START, BRIEFING, DONE, REVIEW ---------- */
      function startScreen() {
        const w = el("div");
        const intro = el("div", undefined, "box");
        intro.appendChild(el("p", "Welcome to the Neuroboost study"));
        intro.appendChild(
          el(
            "p",
            "Thank you for helping us test Neuroboost, a website that helps parents find lesson plans that fit their child.",
          ),
        );
        w.appendChild(intro);

        const how = el("div", undefined, "box");
        how.appendChild(
          el("p", "You will complete 10 short tasks. For each one:"),
        );
        how.appendChild(el("p", "1. Read the scenario and your objective."));
        how.appendChild(el("p", "2. Click OK to begin. A timer starts."));
        how.appendChild(
          el("p", "3. Browse the site to find the lesson you think fits."),
        );
        how.appendChild(
          el(
            "p",
            "4. Click on that lesson. You will go straight to the next task.",
          ),
        );
        how.appendChild(
          el(
            "p",
            "We are testing the website, not you. There are no wrong answers, so please click the way you naturally would. Your clicks and time are recorded.",
          ),
        );
        w.appendChild(how);

        const who = el("div", undefined, "box");
        const lab = el("label", "Participant name or ID (optional)");
        lab.setAttribute("for", "pid");
        const inp = el("input");
        inp.type = "text";
        inp.id = "pid";
        inp.autocomplete = "off";
        who.appendChild(lab);
        who.appendChild(inp);
        w.appendChild(who);

        w.appendChild(btn("Begin", () => beginSession(inp.value.trim())));
        return w;
      }

      function briefScreen() {
        const t = session.order[session.idx];
        const w = el("div");
        w.appendChild(
          el(
            "div",
            "Task " + (session.idx + 1) + " of " + session.order.length,
            "box",
          ),
        );
        const sc = el("div", undefined, "box");
        sc.appendChild(el("p", "Scenario: " + SCENARIO));
        sc.appendChild(el("p", "Your objective: " + t.text));
        sc.appendChild(
          el(
            "p",
            "When you click OK, the timer starts. Click on the lesson you think is the right one.",
          ),
        );
        w.appendChild(sc);
        w.appendChild(btn("OK, start task", startTask));
        return w;
      }

      function doneScreen() {
        const w = el("div");
        const b = el("div", undefined, "box");
        b.appendChild(el("p", "All done. Thank you!"));
        b.appendChild(
          el(
            "p",
            "You completed all " +
              session.order.length +
              " tasks. Your answers have been recorded. You can close this page now.",
          ),
        );
        w.appendChild(b);
        return w;
      }

      function reviewScreen() {
        const w = el("div");
        const ok = RESULTS.filter((r) => r.result === "Correct").length;
        const sessions = new Set(RESULTS.map((r) => r.session_id)).size;
        const unsent = RESULTS.filter((r) => r.sent === false).length;
        const rb = el("div", undefined, "box");
        rb.appendChild(
          el(
            "p",
            "Researcher review. This browser holds " +
              RESULTS.length +
              " saved task results from " +
              sessions +
              " session(s); " +
              ok +
              " correct.",
          ),
        );
        rb.appendChild(
          el(
            "p",
            RESULTS_ENDPOINT
              ? "Google Sheet sending is on. " +
                  unsent +
                  " result(s) in this browser have not reached the sheet yet."
              : "Google Sheet sending is off (no RESULTS_ENDPOINT set). Results stay in this browser only.",
          ),
        );
        w.appendChild(rb);
        const row = el("div", undefined, "row");
        row.style.marginBottom = "12px";
        row.appendChild(btn("Download " + CSV_NAME, downloadCSV));
        if (RESULTS_ENDPOINT && unsent)
          row.appendChild(
            btn("Resend " + unsent + " unsent result(s)", () => {
              flushUnsent();
              render();
            }),
          );
        row.appendChild(
          btn("Clear all saved results", () => {
            if (
              confirm(
                "Delete all saved results from this browser? This cannot be undone.",
              )
            ) {
              RESULTS = [];
              saveAll();
              render();
            }
          }),
        );
        w.appendChild(row);
        const show = [
          "participant_id",
          "session_id",
          "task_position",
          "task_number",
          "duration_sec",
          "click_count",
          "endpoint",
          "result",
        ];
        const wrap = el("div", undefined, "scroll");
        const tbl = el("table", undefined, "results");
        const hr = el("tr");
        show.forEach((c) => hr.appendChild(el("th", c)));
        tbl.appendChild(hr);
        RESULTS.forEach((r) => {
          const tr = el("tr");
          show.forEach((c) =>
            tr.appendChild(el("td", String(r[c] === undefined ? "" : r[c]))),
          );
          tbl.appendChild(tr);
        });
        wrap.appendChild(tbl);
        w.appendChild(wrap);
        return w;
      }

      /* ---------- VIEW A: WHAT KIND OF LESSON (multi-select) ---------- */
      function toggleFilter(v) {
        const i = state.filters.indexOf(v);
        if (i >= 0) state.filters.splice(i, 1);
        else state.filters.push(v);
        log(i >= 0 ? "filter_off" : "filter_on", v);
        render();
      }

      function kindScreen() {
        const wrap = el("div", undefined, "two");
        const left = el("div");
        const right = el("div");

        left.appendChild(
          el(
            "div",
            "Pick as many as you like. Lessons must match everything you pick.",
            "box",
          ),
        );
        CATS.forEach(([name, vals]) => {
          const box = el("div", undefined, "box");
          const isOpen = state.open.indexOf(name) >= 0;
          const n = vals.filter((v) => state.filters.indexOf(v) >= 0).length;
          box.appendChild(
            btn(
              (isOpen ? "[-] " : "[+] ") +
                name +
                (n ? "  (" + n + " picked)" : ""),
              () => {
                if (isOpen) state.open.splice(state.open.indexOf(name), 1);
                else state.open.push(name);
                log("category_toggle", name);
                render();
              },
              "full",
            ),
          );
          if (isOpen) {
            const g = el("div", undefined, "grid");
            g.style.marginTop = "8px";
            g.style.marginBottom = "0";
            vals.forEach((v) => {
              const on = state.filters.indexOf(v) >= 0;
              const count = matches(
                on ? state.filters : state.filters.concat(v),
              ).length;
              const b = btn(
                (on ? "[x] " : "[ ] ") + v + "  (" + count + ")",
                () => toggleFilter(v),
                on ? "on" : "",
              );
              if (!on && count === 0) b.disabled = true;
              g.appendChild(b);
            });
            box.appendChild(g);
          }
          left.appendChild(box);
        });

        const res = matches(state.filters);
        const head = el("div", undefined, "box");
        head.appendChild(
          el(
            "p",
            "Your picks: " +
              (state.filters.length ? state.filters.join(", ") : "none yet"),
          ),
        );
        head.appendChild(el("p", res.length + " matching lessons"));
        if (state.filters.length) {
          head.appendChild(
            btn("Clear all picks", () => {
              state.filters = [];
              log("clear_filters", "Clear all picks");
              render();
            }),
          );
        }
        right.appendChild(head);

        if (res.length === 0) {
          right.appendChild(
            el(
              "div",
              "No lessons match all of these picks. Remove one to see more.",
              "placeholder",
            ),
          );
        } else {
          const list = el("div", undefined, "list");
          res.forEach((l) =>
            list.appendChild(btn(lessonLabel(l), () => openLesson(l))),
          );
          right.appendChild(list);
        }

        wrap.appendChild(left);
        wrap.appendChild(right);
        return wrap;
      }

      /* ---------- VIEW B: BY SUBJECT (hierarchy) ---------- */
      function subjScreen() {
        const p = state.path;
        const w = el("div");
        w.appendChild(
          el(
            "div",
            ["Pick a subject", "Pick a setting", "Pick a lesson"][p.length],
            "box",
          ),
        );
        const grid = el("div", undefined, p.length === 2 ? "list" : "grid");

        if (p.length === 0) {
          SUBJECTS.forEach((s) => {
            const n = LESSONS.filter((l) => l.subject === s).length;
            grid.appendChild(
              btn(s + "  (" + n + " lessons)", () => {
                state.path.push({ label: s, key: s });
                log("select", s);
                render();
              }),
            );
          });
        } else if (p.length === 1) {
          ["Online", "Offline"].forEach((e) => {
            const n = LESSONS.filter(
              (l) => l.subject === p[0].key && l.tags.has(e),
            ).length;
            grid.appendChild(
              btn(e + "  (" + n + " lessons)", () => {
                state.path.push({ label: e, key: e });
                log("select", e);
                render();
              }),
            );
          });
        } else {
          const list = LESSONS.filter(
            (l) => l.subject === p[0].key && l.tags.has(p[1].key),
          );
          if (list.length === 0) {
            w.appendChild(
              el(
                "div",
                "No lessons here yet. Use Back to try another setting.",
                "placeholder",
              ),
            );
            return w;
          }
          list.forEach((l) =>
            grid.appendChild(btn(lessonLabel(l), () => openLesson(l))),
          );
        }
        w.appendChild(grid);
        return w;
      }

      /* ---------- NAVIGATION ---------- */
      function goBack() {
        if (state.view === "subj") state.path.pop();
        log("back", "Back");
        render();
      }
      function startOver() {
        if (state.view === "kind") state.filters = [];
        else state.path = [];
        log("start_over", "Start over");
        render();
      }

      function render() {
        const inTask = state.phase === "task";
        $("taskbar").style.display = inTask ? "" : "none";
        $("viewsBox").style.display = inTask ? "" : "none";
        $("crumbs").style.display = inTask ? "" : "none";
        const m = $("main");
        m.innerHTML = "";

        if (state.phase === "start") {
          m.appendChild(startScreen());
          return;
        }
        if (state.phase === "brief") {
          m.appendChild(briefScreen());
          return;
        }
        if (state.phase === "done") {
          m.appendChild(doneScreen());
          return;
        }
        if (state.phase === "review") {
          m.appendChild(reviewScreen());
          return;
        }

        const tb = $("taskbar");
        tb.innerHTML = "";
        tb.appendChild(
          el("p", "Task " + (session.idx + 1) + " of " + session.order.length),
        );
        tb.appendChild(el("p", "Your objective: " + cur.task.text));

        const views = $("views");
        views.innerHTML = "";
        Object.keys(VIEWS).forEach((k) => {
          views.appendChild(
            btn(
              VIEWS[k],
              () => {
                state.view = k;
                log("view", VIEWS[k]);
                render();
              },
              state.view === k ? "on" : "",
            ),
          );
        });

        const c = $("crumbs");
        c.innerHTML = "";
        let here = "You are here: Home > " + VIEWS[state.view];
        if (state.view === "kind" && state.filters.length)
          here += " > " + state.filters.length + " picked";
        if (state.view === "subj" && state.path.length)
          here += " > " + state.path.map((p) => p.label).join(" > ");
        c.appendChild(el("p", here));
        const row = el("div", undefined, "row");
        row.style.marginTop = "8px";
        const back = btn("Back", goBack);
        back.disabled = state.view === "kind" || state.path.length === 0;
        row.appendChild(back);
        row.appendChild(btn("Start over", startOver));
        c.appendChild(row);

        m.appendChild(state.view === "kind" ? kindScreen() : subjScreen());
      }

      // Researcher view: open index.html?review to see saved results and download the CSV.
      if (/[?&]review\b/.test(location.search)) state.phase = "review";
      flushUnsent();
      render();
    </script>
  </body>
</html>
