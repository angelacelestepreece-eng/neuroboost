<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find your lesson plan · Neuroboost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#results">Skip to lessons</a>
  <header class="site-header"><a class="brand" href="index.html">Neuroboost</a></header>

  <main class="page">
    <h1 class="page-title">Find your lesson plan</h1>

    <div class="layout">
      <div>
        <button class="filters-toggle" id="filtersToggle" aria-expanded="false" aria-controls="filters">
          <span>Filter</span><span id="toggleCount"></span>
        </button>
        <aside class="filters collapsed" id="filters" aria-label="Filter lessons">
          <h2>Filter</h2>
          <div id="filterGroups"></div>
        </aside>
      </div>

      <section id="results" aria-label="Lessons">
        <div class="results-bar" id="chips" aria-label="Selected filters"></div>
        <p class="count" id="count" aria-live="polite"></p>
        <ul class="tiles" id="tiles"></ul>
      </section>
    </div>
  </main>

  <script src="js/lessons.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
